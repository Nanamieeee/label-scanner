<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ИИ Состав-Сканер</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      max-width: 500px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; margin: 0; }
    .settings-btn {
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .key-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .key-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .key-box button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      cursor: pointer;
    }
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .chip {
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      background: #22c55e22;
      border-color: #22c55e;
      color: #22c55e;
      font-weight: 600;
    }
    .scan-btn {
      width: 100%;
      padding: 16px;
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .scan-btn:disabled {
      background: #27272a;
      color: #71717a;
    }
    #preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
      margin-bottom: 12px;
      border: 1px solid #27272a;
    }
    .status {
      text-align: center;
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: none;
    }
    .ai-result {
      font-size: 15px;
      line-height: 1.6;
      color: #e4e4e7;
      white-space: pre-wrap;
    }
    .ai-result strong { color: #22c55e; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🧠 ИИ Состав-Сканер</h1>
    <button class="settings-btn" id="toggleKeyBtn">🔑 API-ключ</button>
  </div>

  <div class="key-box" id="keyBox">
    <div style="font-size:12px; color:#a1a1aa; margin-bottom:6px;">
      Ключ Mistral AI:
    </div>
    <input type="password" id="apiKeyInput" placeholder="Вставь ключ Mistral AI...">
    <button id="saveKeyBtn">Сохранить ключ</button>
  </div>

  <div class="filters">
    <div class="chip active" data-goal="Общий разбор: вредные добавки, сахар, трансжиры">Общий разбор</div>
    <div class="chip" data-goal="Строгий контроль сахара и скрытых подсластителей">Без сахара</div>
    <div class="chip" data-goal="Поиск аллергенов (лактоза, глютен, орехи, соя, яйца)">Аллергены</div>
    <div class="chip" data-goal="Разбор состава косметики или бытовой химии">Косметика / Химия</div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <button class="scan-btn" id="openCamBtn">📷 Сфоткать состав</button>

  <img id="preview" alt="Превью">
  <div class="status" id="statusText">Сфоткай состав на упаковке — нейросеть прочитает и разберет его за пару секунд</div>

  <div class="card" id="resultCard">
    <div class="ai-result" id="aiOutput"></div>
  </div>

  <script>
    const MY_MISTRAL_KEY = "mstrl_4H1mZNKNouiwAcZ60nWoa9bx0UXynziV_2RT2gL";

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    let currentGoal = "Общий разбор: вредные добавки, сахар, трансжиры";
    const keyBox = document.getElementById("keyBox");
    const apiKeyInput = document.getElementById("apiKeyInput");

    const activeKey = MY_MISTRAL_KEY !== "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ"
      ? MY_MISTRAL_KEY
      : (localStorage.getItem("mistral_key") || "");

    if (activeKey) {
      localStorage.setItem("mistral_key", activeKey);
      apiKeyInput.value = activeKey;
    } else {
      keyBox.style.display = "block";
    }

    document.getElementById("toggleKeyBtn").onclick = () => {
      keyBox.style.display = keyBox.style.display === "none" ? "block" : "none";
    };

    document.getElementById("saveKeyBtn").onclick = () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem("mistral_key", val);
        keyBox.style.display = "none";
        document.getElementById("statusText").textContent = "✅ Ключ сохранен! Теперь можно фоткать.";
      }
    };

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.onclick = () => {
        document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        currentGoal = chip.dataset.goal;
      };
    });

    document.getElementById("openCamBtn").onclick = () => {
      if (!localStorage.getItem("mistral_key")) {
        keyBox.style.display = "block";
        document.getElementById("statusText").textContent = "⚠️ Сначала вставь API-ключ сверху";
        return;
      }
      document.getElementById("cameraInput").click();
    };

    function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxSide = 1280;
          let w = img.width;
          let h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
            else { w = Math.round(w * maxSide / h); h = maxSide; }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    document.getElementById("cameraInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const btn = document.getElementById("openCamBtn");
      const status = document.getElementById("statusText");
      const preview = document.getElementById("preview");
      const resultCard = document.getElementById("resultCard");
      const aiOutput = document.getElementById("aiOutput");

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      resultCard.style.display = "none";
      btn.disabled = true;
      status.textContent = "⏳ Отправляю фото в нейросеть...";

      try {
        const base64Image = await compressImage(file);
        const apiKey = localStorage.getItem("mistral_key");

        const prompt = `Прочитай состав на этом фото. Цель проверки: ${currentGoal}.
Ответь кратко, структурно и понятным языком на русском (без воды):
1. Вердикт: (🟢 Норм / 🟡 Спорно / 🔴 Лучше не брать) и оценка от 1 до 10.
2. Что напрягает: перечисли сомнительные компоненты с фото и в 3 словах объясни, что это.
3. Что хорошего: если есть плюсы.
Если текст на фото нечитаемый, так и напиши.`;

        const response = await fetch("/.netlify/functions/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            apiKey,
            payload: {
              model: "pixtral-12b-2409",
              messages: [
                {
                  role: "user",
                  content: [
                    { type: "text", text: prompt },
                    { type: "image_url", image_url: base64Image }
                  ]
                }
              ]
            }
          })
        });

        const data = await response.json();

        if (!response.ok || data.error || data.message) {
          throw new Error(data.error?.message || data.message || `HTTP ${response.status}`);
        }

        const reply = data.choices[0].message.content;
        aiOutput.innerHTML = reply.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        resultCard.style.display = "block";
        status.textContent = "✅ Готово!";
      } catch (err) {
        status.textContent = "❌ Ошибка: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
